# yaml-language-server: $schema=../schema.json
# Environment config for SOM CI/CD custom flow testing
# Full SOM mode — the CD pipeline creates the runtime from scratch (no ClickOps)

account:
  name: NIFIHUB_TEST
  github_environment: NIFIHUB_TEST

deployments:
  - name: SGOPE_OPENFLOW
    deployment_type: SNOWFLAKE
    runtimes:
      # Existing runtimes — preserve but don't manage
      - name: POSTGRES_DEMO
        database: OPENFLOW
        schema: OPENFLOW
        node_type: LARGE
        min_nodes: 1
        max_nodes: 1
        reconcile: false
      - name: SQL_API_TEST
        database: OPENFLOW
        schema: OPENFLOW
        node_type: LARGE
        min_nodes: 1
        max_nodes: 1
        suspend: false
        reconcile: false

      # NEW runtime — created by the CD pipeline (no ClickOps)
      - name: CD_CUSTOM_FLOW_RUNTIME
        database: OPENFLOW
        schema: OPENFLOW
        node_type: SMALL
        min_nodes: 1
        max_nodes: 1
        execute_as_role: OPENFLOW_ROLE_RW
        network_rules:
          - name: NIFIHUB_EGRESS
            type: HOST_PORT
            mode: EGRESS
            values:
              - "spxramy6onfkpahkmkwhf623dm.sfsenorthamerica-sfse-prevalkar.us-east-1.aws.postgres.snowflake.app:5432"
        flow_registries:
          - name: nifihub
            type: org.apache.nifi.github.GitHubFlowRegistryClient
            properties:
              Repository Owner: sfc-gh-sgope
              Repository Name: nifihub
              Authentication Type: PERSONAL_ACCESS_TOKEN
              Personal Access Token: ${{ secrets.NIFIHUB_REGISTRY_PAT }}
              Default Branch: main
              Repository Path: flows
        flows:
          - name: "Snowflake-to-Postgres"
            bucket: custom
            flow: snowflake-to-postgres
            version: latest
            start: true

