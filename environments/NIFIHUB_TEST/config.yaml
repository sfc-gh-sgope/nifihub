# yaml-language-server: $schema=../schema.json
# Environment config for SOM CI/CD custom flow testing
# Full SOM mode — the CD pipeline creates the runtime from scratch (no ClickOps)

account:
  name: som-cicd-test
  github_environment: som-cicd-test

deployments:
  - name: SOM_DEPLOYMENT
    deployment_type: SNOWFLAKE
    runtimes:
      # Existing runtimes — preserve but don't manage
      - name: CUSTOM_FLOW_RUNTIME
        database: OPENFLOW
        schema: PUBLIC
        node_type: SMALL
        min_nodes: 1
        max_nodes: 1
        reconcile: false
      - name: SOM_CICD_RUNTIME
        database: OPENFLOW
        schema: PUBLIC
        node_type: SMALL
        min_nodes: 1
        max_nodes: 1
        suspend: true
        reconcile: false
      - name: HOL_DEMO
        database: OPENFLOW
        schema: PUBLIC
        node_type: SMALL
        min_nodes: 1
        max_nodes: 1
        suspend: true
        reconcile: false
      - name: HOL_DEMO_GEN2
        database: OPENFLOW
        schema: PUBLIC
        node_type: SMALL
        min_nodes: 1
        max_nodes: 1
        suspend: true
        reconcile: false
      - name: SOM_RUNTIME
        database: OPENFLOW
        schema: PUBLIC
        node_type: SMALL
        min_nodes: 1
        max_nodes: 1
        suspend: true
        reconcile: false

      # NEW runtime — created by the CD pipeline (no ClickOps)
      - name: CD_CUSTOM_FLOW_RUNTIME
        database: OPENFLOW
        schema: PUBLIC
        node_type: SMALL
        min_nodes: 1
        max_nodes: 1
        execute_as_role: OPENFLOW_RUNTIME_ROLE_PRASADRUNTIME
        network_rules:
          - name: POSTGRES_EGRESS
            type: HOST_PORT
            mode: EGRESS
            values:
              - "spxramy6onfkpahkmkwhf623dm.sfsenorthamerica-sfse-prevalkar.us-east-1.aws.postgres.snowflake.app:5432"
        flow_registries:
          - name: nifihub
            type: org.apache.nifi.github.GitHubFlowRegistryClient
            properties:
              Repository Owner: sfc-gh-prevalkar
              Repository Name: nifihub
              Authentication Type: PERSONAL_ACCESS_TOKEN
              Personal Access Token: ${{ secrets.NIFIHUB_REGISTRY_PAT }}
              Default Branch: main
              Repository Path: flows
        flows:
          - name: "Snowflake-to-Postgres"
            bucket: custom
            flow: snowflake-to-postgres
            version: latest
            start: true

      # PROD runtime — pinned to a specific commit SHA (promoted from DEV)
      - name: CD_CUSTOM_FLOW_RUNTIME_PROD
        database: OPENFLOW
        schema: PUBLIC
        node_type: SMALL
        min_nodes: 1
        max_nodes: 1
        execute_as_role: OPENFLOW_RUNTIME_ROLE_PRASADRUNTIME
        network_rules:
          - name: POSTGRES_EGRESS_PROD
            type: HOST_PORT
            mode: EGRESS
            values:
              - "spxramy6onfkpahkmkwhf623dm.sfsenorthamerica-sfse-prevalkar.us-east-1.aws.postgres.snowflake.app:5432"
        flow_registries:
          - name: nifihub
            type: org.apache.nifi.github.GitHubFlowRegistryClient
            properties:
              Repository Owner: sfc-gh-prevalkar
              Repository Name: nifihub
              Authentication Type: PERSONAL_ACCESS_TOKEN
              Personal Access Token: ${{ secrets.NIFIHUB_REGISTRY_PAT }}
              Default Branch: main
              Repository Path: flows
        flows:
          - name: "Snowflake-to-Postgres"
            bucket: custom
            flow: snowflake-to-postgres
            version: "7d8cd0f2164d8b650eacc19e52b47169a1ecfccd"
            start: true

